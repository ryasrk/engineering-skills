name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Skills Suite & Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit test suite
        run: python3 -m unittest discover -s tests -v

      - name: Run repository validator
        run: python3 scripts/validate_skills.py

      - name: Test installation script (dry-run and execute)
        run: |
          ./scripts/install.sh --dry-run /tmp/skills-dry
          ./scripts/install.sh --force /tmp/skills-live
          test -f /tmp/skills-live/brd-writing/SKILL.md
          ./scripts/install.sh --uninstall /tmp/skills-live
          test ! -d /tmp/skills-live/brd-writing
